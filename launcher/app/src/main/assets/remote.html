<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070d">
<title>TV Fare</title>
<style>
  :root { --cyan:#00e5ff; --violet:#8b5cf6; --bg:#05070d; --panel:#0d1322; --dim:#7d8aa6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; background:var(--bg); color:#fff; font:15px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px); gap:10px;
         background:radial-gradient(120% 60% at 100% 0%, #8b5cf633, transparent 60%), radial-gradient(90% 50% at 0% 100%, #00e5ff22, transparent 60%), var(--bg); }
  header { display:flex; align-items:center; gap:10px; }
  header h1 { font-size:13px; letter-spacing:4px; margin:0; font-weight:600; }
  #dot { width:10px; height:10px; border-radius:50%; background:#ff4d6d; box-shadow:0 0 10px #ff4d6d; }
  #dot.on { background:var(--cyan); box-shadow:0 0 10px var(--cyan); }
  #state { color:var(--dim); font-size:12px; margin-left:auto; }
  #pad { flex:1; min-height:200px; border-radius:22px; position:relative; touch-action:none; overflow:hidden;
         background:linear-gradient(#ffffff05 1px, transparent 1px) 0 0/28px 28px, linear-gradient(90deg,#ffffff05 1px, transparent 1px) 0 0/28px 28px, #0b111dcc;
         border:1px solid transparent; background-clip:padding-box; box-shadow:inset 0 0 0 1.5px #00e5ff55, 0 0 30px #00e5ff14; }
  #pad .hint { position:absolute; inset:auto 0 14px; text-align:center; color:var(--dim); font-size:12px; letter-spacing:1px; pointer-events:none; }
  #ripple { position:absolute; width:60px; height:60px; margin:-30px; border-radius:50%; border:2px solid var(--cyan); opacity:0; pointer-events:none; }
  .grid { display:grid; gap:8px; }
  .g4 { grid-template-columns:repeat(4,1fr); }
  .g5 { grid-template-columns:repeat(5,1fr); }
  button { appearance:none; border:0; border-radius:14px; padding:13px 0; background:var(--panel); color:#fff; font-size:18px;
           box-shadow:inset 0 0 0 1px #ffffff12; touch-action:manipulation; }
  button small { display:block; font-size:10px; color:var(--dim); letter-spacing:1px; margin-top:2px; }
  button:active { background:#16203a; box-shadow:inset 0 0 0 1.5px var(--cyan), 0 0 16px #00e5ff55; }
  .row { display:flex; gap:8px; }
  #text { flex:1; min-width:0; border-radius:14px; border:0; padding:13px 14px; background:var(--panel); color:#fff; font-size:16px;
          box-shadow:inset 0 0 0 1px #ffffff12; outline:none; user-select:text; -webkit-user-select:text; }
  #text:focus { box-shadow:inset 0 0 0 1.5px var(--cyan); }
  .row button { padding:0 16px; }
  #sens { width:100%; accent-color:var(--cyan); }
  .lbl { color:var(--dim); font-size:11px; letter-spacing:2px; }
  #gate { position:fixed; inset:0; background:#05070df2; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; }
  #gate.show { display:flex; }
  #gate input { font-size:32px; letter-spacing:12px; width:200px; text-align:center; border-radius:16px; border:0; padding:12px; background:var(--panel); color:#fff;
                box-shadow:inset 0 0 0 1.5px var(--cyan); outline:none; user-select:text; -webkit-user-select:text; }
  #gate p { color:var(--dim); margin:0; }
</style>
</head>
<body>
<header><div id="dot"></div><h1>TV FARE</h1><span id="state">bağlanıyor…</span></header>

<div id="pad"><div id="ripple"></div><div class="hint">1 parmak: imleç · dokun: tıkla · basılı tut: uzun bas · 2 parmak: kaydır · 2 parmakla dokun: geri</div></div>

<div class="grid g5">
  <button data-k="back">⟵<small>GERİ</small></button>
  <button data-k="home">⌂<small>EV</small></button>
  <button data-k="up">▲<small>YUKARI</small></button>
  <button data-k="recents">▣<small>SON</small></button>
  <button data-k="notifications">🔔<small>BİLDİRİM</small></button>
  <button data-k="playpause">⏯<small>OYNAT</small></button>
  <button data-k="left">◀<small>SOL</small></button>
  <button data-k="ok">●<small>OK</small></button>
  <button data-k="right">▶<small>SAĞ</small></button>
  <button data-k="mute">🔇<small>SESSİZ</small></button>
  <button data-k="rew">⏪<small>GERİ SAR</small></button>
  <button data-k="voldown">－<small>SES</small></button>
  <button data-k="down">▼<small>AŞAĞI</small></button>
  <button data-k="volup">＋<small>SES</small></button>
  <button data-k="ff">⏩<small>İLERİ SAR</small></button>
</div>

<div class="row">
  <input id="text" placeholder="TV'ye yaz (önce TV'de alana tıkla)" autocomplete="off" autocapitalize="off" enterkeyhint="go">
  <button id="enter">↵</button>
</div>
<div><span class="lbl">HASSASİYET</span><input id="sens" type="range" min="0.6" max="4" step="0.1"></div>

<div id="gate">
  <h1 style="letter-spacing:4px;font-size:15px">PIN</h1>
  <p>TV Home ana ekranının sağ üstündeki 4 haneli PIN</p>
  <input id="pin" inputmode="numeric" maxlength="4" autocomplete="one-time-code">
  <button id="pinGo" style="width:200px">BAĞLAN</button>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get: k => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };
  let ws = null, retry = 0;
  let sens = parseFloat(store.get('sens') || '1.8');
  $('sens').value = sens;
  $('sens').oninput = e => { sens = parseFloat(e.target.value); store.set('sens', sens); };

  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
  const send = msg => { if (ws && ws.readyState === 1) ws.send(msg); };
  const setState = (on, text) => { $('dot').classList.toggle('on', on); $('state').textContent = text; };

  function connect() {
    const pin = store.get('pin');
    if (!pin) { $('gate').classList.add('show'); return; }
    ws = new WebSocket(`ws://${location.host}/ws?pin=${encodeURIComponent(pin)}`);
    ws.onmessage = e => { if (e.data === 'ok') { retry = 0; setState(true, 'bağlı'); } };
    ws.onclose = e => {
      setState(false, 'bağlantı yok');
      if (e.code === 1008) { store.set('pin', ''); $('gate').classList.add('show'); return; }
      setTimeout(connect, Math.min(4000, 300 * ++retry));
    };
  }
  $('pinGo').onclick = () => {
    const v = $('pin').value.trim();
    if (v.length !== 4) return;
    store.set('pin', v); $('gate').classList.remove('show'); connect();
  };
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && (!ws || ws.readyState > 1)) connect();
  });

  // ---- touchpad ----
  const pad = $('pad'), ripple = $('ripple');
  const pts = new Map();
  let mx = 0, my = 0, sx = 0, sy = 0, frame = 0;
  let start = 0, travel = 0, maxFingers = 0, longTimer = 0, longFired = false;

  function flush() {
    frame = 0;
    if (Math.abs(mx) >= 0.5 || Math.abs(my) >= 0.5) { send(`m ${mx.toFixed(1)} ${my.toFixed(1)}`); mx = my = 0; }
    if (Math.abs(sx) >= 1 || Math.abs(sy) >= 1) { send(`s ${sx.toFixed(0)} ${sy.toFixed(0)}`); sx = sy = 0; }
  }
  const schedule = () => { if (!frame) frame = requestAnimationFrame(flush); };

  function showRipple(x, y) {
    const r = pad.getBoundingClientRect();
    ripple.style.left = (x - r.left) + 'px'; ripple.style.top = (y - r.top) + 'px';
    ripple.animate([{ opacity: .9, transform: 'scale(.4)' }, { opacity: 0, transform: 'scale(1.4)' }], { duration: 320 });
  }

  pad.addEventListener('pointerdown', e => {
    pad.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) {
      start = performance.now(); travel = 0; maxFingers = 1; longFired = false;
      clearTimeout(longTimer);
      longTimer = setTimeout(() => { if (travel < 10 && pts.size === 1) { longFired = true; send('l'); buzz(30); } }, 600);
    }
    maxFingers = Math.max(maxFingers, pts.size);
  });

  pad.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    travel += Math.abs(dx) + Math.abs(dy);
    if (pts.size === 1) {
      // Pointer acceleration: slow moves stay precise, fast flicks cross the screen.
      const speed = Math.hypot(dx, dy);
      const accel = 1 + Math.min(speed / 12, 2.2);
      mx += dx * sens * accel; my += dy * sens * accel;
    } else if (pts.size === 2) {
      sx += dx * 3; sy += dy * 3;
    }
    schedule();
  });

  function end(e) {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size > 0) return;
    clearTimeout(longTimer);
    const quick = performance.now() - start < 280 && travel < 12;
    if (!longFired && quick) {
      if (maxFingers >= 2) { send('k back'); buzz(15); }
      else { send('c'); buzz(10); showRipple(e.clientX, e.clientY); }
    }
  }
  pad.addEventListener('pointerup', end);
  pad.addEventListener('pointercancel', end);

  // ---- buttons ----
  document.querySelectorAll('button[data-k]').forEach(b => {
    b.addEventListener('click', () => { send('k ' + b.dataset.k); buzz(8); });
  });

  // ---- keyboard: the TV field mirrors this box live ----
  let typeTimer = 0;
  $('text').addEventListener('input', e => {
    clearTimeout(typeTimer);
    typeTimer = setTimeout(() => send('t ' + e.target.value), 90);
  });
  const enter = () => { clearTimeout(typeTimer); send('t ' + $('text').value); send('e'); $('text').value = ''; };
  $('enter').onclick = enter;
  $('text').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); enter(); } });

  setInterval(() => send('p'), 20000);
  connect();
})();
</script>
</body>
</html>
